# Build the panel image and publish it to GHCR: what `npm run push` does on a dev machine, so a
# release no longer needs Docker on the machine the code is written on.
#
# Every pull request and push to main builds and smoke tests the image. Publishing is a separate,
# deliberate step, as `npm run push` was: run this workflow by hand from main. `latest` is what
# Unraid's update check and the Auto Update Applications plugin pull, so a merge must not roll
# out to the panels by itself.
name: image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'hardware/**', 'ha/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'hardware/**', 'ha/**']
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/theater-panel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same stamp as `npm run push`: date.shortsha, shown by the panel and compared by its
      # update entity.
      - name: Build version
        id: version
        run: |
          echo "value=$(date -u +%Y.%-m.%-d).${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: theater-panel:smoketest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_TIME=${{ steps.version.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must start and pass its own HEALTHCHECK with no configuration at all, as a
      # fresh Unraid install does before the settings page has been filled in.
      - name: Smoke test the image
        run: |
          docker run -d --name smoketest -p 18787:8787 theater-panel:smoketest
          for i in $(seq 1 60); do
            health=$(docker inspect -f '{{.State.Health.Status}}' smoketest 2>/dev/null || echo none)
            [ "$health" = "healthy" ] && break
            sleep 2
          done
          echo "container health: $health"
          curl -fsS --max-time 3 http://127.0.0.1:18787/healthz
          docker logs smoketest
          [ "$health" = "healthy" ] || { echo "::error::HEALTHCHECK never passed ($health)"; exit 1; }
          docker rm -f smoketest

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker (not OCI) manifest types and no attestations: Unraid's update check can't read an
      # OCI index and reports "not available".
      - name: Build and push amd64 + arm64
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_TIME=${{ steps.version.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: echo "Published $IMAGE:$VERSION and :latest" >> "$GITHUB_STEP_SUMMARY"
