# Theater panel: Home Assistant package.
#
# Install: copy to /config/packages/theater.yaml and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant (or reload scripts, automations and input helpers).
#
# The panel calls only these scripts, so the same scenes work from Pico remotes, voice and
# the HA app. The play and projector scripts take their entities from the panel (ENTITY_*
# settings); the scenes and automations name the room's entities here. If yours are called
# something else, change them in this file and in the panel's settings.
#
#   Downlights    light.media_room_downlights        (4 Govee, dimmable, color temp + RGB)
#   Accent lights light.home_theater_accent_lights   (4 Govee accents, RGB)
#   LED strip     light.home_theater_wled            (WLED, 188 LEDs)
#   Apple TV      media_player.home_theater
#   Music         media_player.home_theater_2        (Music Assistant)
#   Projector     media_player.theater_projector     (Android Debug Bridge; the ADB automation)
#   Plezy         media_player.plex_plezy_aurora_pro (the projector's Plex client, as HA's Plex
#                                                     integration names it; lights follow it)

# The panel is a Home Assistant device over the ESPHome native API (Settings > Devices &
# services > ESPHome, the container's address, port 6053). That brings its controls and sensors
# (the theme and accent, cinema mode, the sleep timer, what is playing, the build and an update
# entity) and these actions, which the scripts below use:
#   esphome.theater_panel_navigate  data: { route: "#/watch?brand=netflix" }   move every panel
#   esphome.theater_panel_play      data: { rating_key: "12345" }              start a title
#   esphome.theater_panel_scene     data: { name: pre_show }                   run a scene
#   esphome.theater_panel_voice     data: { intent: play, query: "Jaws", name: "", route: "" }
#                                   (an ESPHome action needs every argument, blank or not)
# An action returns nothing, so the voice intents wait for the panel's "Voice answer" sensor
# to change and speak that. Kiosk Satellite's own navigate service moves the HA dashboard
# around the panel, not the panel.
#
# Entity ids below are what HA made for a device called "theater-panel" in the Home Theater
# area; if yours differ, change them here.

input_select:
  theater_scene:
    name: Theater scene
    icon: mdi:theater
    options: ["Off", "Pre-show", "Movie time", "Intermission", "Lights up"]

input_boolean:
  theater_auto_lights:
    name: Theater lights follow playback
    icon: mdi:lightbulb-auto
    initial: true

script:
  # ---------- scenes ----------

  theater_pre_show:
    alias: "Theater: Pre-show"
    icon: mdi:music
    sequence:
      # If the picture was blanked (projector picture off), bring it back.
      - action: script.theater_projector_light_on
        data: { projector: media_player.theater_projector }
        continue_on_error: true
      - action: light.turn_on
        target: { entity_id: light.media_room_downlights }
        data: { brightness_pct: 40, color_temp_kelvin: 2700, transition: 3 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 25, rgb_color: [255, 138, 60], transition: 3 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_wled }
        data: { brightness_pct: 60, effect: Candle }
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Pre-show }

  theater_movie_time:
    alias: "Theater: Movie time"
    icon: mdi:filmstrip
    # The play scripts run this while the playback automation is already dimming the room;
    # queue rather than drop the second call.
    mode: queued
    sequence:
      # If the picture was blanked (projector picture off), bring it back.
      - action: script.theater_projector_light_on
        data: { projector: media_player.theater_projector }
        continue_on_error: true
      # Stop pre-show music; the movie has the room now.
      - action: media_player.media_pause
        target: { entity_id: media_player.home_theater_2 }
        continue_on_error: true
      - action: script.theater_lights_movie
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Movie time }

  theater_intermission:
    alias: "Theater: Intermission"
    icon: mdi:coffee
    sequence:
      # The pause runs as its own script, started and not waited for: the Apple TV integration
      # can raise mid-reconnect, and continue_on_error does not cover an unexpected exception, so
      # a pause that fails must not take the lights and the snack-bar screen down with it.
      - action: script.turn_on
        target: { entity_id: script.theater_pause_playback }
      # Not waited for either: the scene change is what puts the snack bar on the panel, so it
      # must happen even if the lights step stalls or fails.
      - action: script.turn_on
        target: { entity_id: script.theater_lights_intermission }
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Intermission }

  theater_pause_playback:
    alias: "Theater: pause whatever is playing"
    mode: single
    sequence:
      # The Apple TV only honours media_pause while it reports something playing, and Plezy and
      # Strimr play without it noticing. Their Plex player entities do know, so toggle the Apple TV
      # (the play/pause the panel's own button sends) only when one of them is playing.
      - if:
          - condition: or
            conditions:
              - condition: state
                entity_id: media_player.plex_plezy_apple_tv
                state: playing
              - condition: state
                entity_id: media_player.plex_strimr_tvos
                state: playing
        then:
          - action: media_player.media_play_pause
            target: { entity_id: media_player.home_theater }
            continue_on_error: true
        else:
          - action: media_player.media_pause
            target: { entity_id: media_player.home_theater }
            continue_on_error: true
      # Films in Plezy play on the projector's own Android, where the Apple TV can't pause them:
      # send the projector the pause key as well (127 = MEDIA_PAUSE, which never un-pauses).
      - if:
          - condition: template
            value_template: "{{ states('media_player.theater_projector') not in ['unavailable', 'unknown', 'off'] }}"
        then:
          - action: androidtv.adb_command
            target: { entity_id: media_player.theater_projector }
            data: { command: "input keyevent 127" }
            continue_on_error: true

  # The JBL bar's own volume and mute, for remotes that can run a script but not press a button
  # (the Astrion's TV card). The bar steps by its own increment, the same as its remote.
  theater_bar_volume_up:
    alias: "Theater: soundbar volume up"
    icon: mdi:volume-plus
    mode: queued
    sequence:
      - action: button.press
        target: { entity_id: button.jbl_bar_1300mk2_increase_volume }

  theater_bar_volume_down:
    alias: "Theater: soundbar volume down"
    icon: mdi:volume-minus
    mode: queued
    sequence:
      - action: button.press
        target: { entity_id: button.jbl_bar_1300mk2_lower_volume }

  theater_bar_mute:
    alias: "Theater: soundbar mute"
    icon: mdi:volume-mute
    mode: single
    sequence:
      - action: button.press
        target: { entity_id: button.jbl_bar_1300mk2_mute }

  theater_lights_up:
    alias: "Theater: Lights up"
    icon: mdi:weather-sunny
    sequence:
      - action: media_player.media_stop
        target: { entity_id: media_player.home_theater_2 }
        continue_on_error: true
      - action: light.turn_on
        target: { entity_id: light.media_room_downlights }
        data: { brightness_pct: 100, color_temp_kelvin: 4000, transition: 4 }
      - action: light.turn_off
        target: { entity_id: [light.home_theater_accent_lights, light.home_theater_wled] }
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Lights up }

  theater_all_off:
    alias: "Theater: All off"
    icon: mdi:power
    sequence:
      - action: light.turn_off
        target: { entity_id: [light.media_room_downlights, light.home_theater_accent_lights, light.home_theater_wled] }
        data: { transition: 3 }
      - action: media_player.media_stop
        target: { entity_id: media_player.home_theater_2 }
        continue_on_error: true
      # Turning the Apple TV off sends HDMI-CEC standby to the projector.
      - action: media_player.turn_off
        target: { entity_id: media_player.home_theater }
        continue_on_error: true
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: "Off" }

  # Lights only, used by the scenes above and by the playback automation (which must not
  # pause the movie itself).
  theater_lights_movie:
    alias: "Theater: lights for the movie"
    mode: queued
    sequence:
      - action: light.turn_off
        target: { entity_id: light.media_room_downlights }
        data: { transition: 6 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 4, rgb_color: [255, 120, 40], transition: 6 }
      - action: light.turn_off
        target: { entity_id: light.home_theater_wled }

  # Any sound the panel wants played in the room: the intermission march, and whatever comes
  # next. The panel passes the speaker and a URL it serves itself.
  theater_snipe:
    alias: "Theater: play a sound in the room"
    mode: restart
    fields:
      speaker:
        description: Media player to play it on
        example: media_player.home_theater_2
      url:
        description: URL of the sound
        example: https://ht-kiosk.coulson.io/assets/intermission.mp3
    sequence:
      - condition: template
        # A real boolean: "speaker and url" renders the URL itself, which HA reads as false.
        value_template: "{{ (speaker is defined and speaker | length > 0) and (url is defined and url | length > 0) }}"
      - action: media_player.play_media
        target: { entity_id: "{{ speaker }}" }
        data:
          media_content_id: "{{ url }}"
          media_content_type: music
      # Casting to the JBL moves it off the film's input. Once the clip ends, put it back on the one
      # the projector is showing: HDMI (the Apple TV plugged into the bar) or TV (the projector's
      # own apps, over eARC). Decided from the projector, not the bar, since a clip that restarts
      # this script finds the bar already on Cast.
      - if:
          - condition: template
            value_template: "{{ speaker == 'media_player.jbl_bar_1300mk2' }}"
        then:
          - variables:
              back_to: >-
                {{ 'button.jbl_bar_1300mk2_hdmi'
                   if states('sensor.home_theater_nexigo_aurora_pro_nexigo_aurora_pro_showing').startswith('HDMI')
                   else 'button.jbl_bar_1300mk2_tv' }}
          - wait_for_trigger:
              - trigger: state
                entity_id: media_player.jbl_bar_1300mk2
                to: playing
            timeout: "00:00:20"
            continue_on_timeout: true
          - wait_for_trigger:
              - trigger: state
                entity_id: media_player.jbl_bar_1300mk2
                from: playing
            timeout: "00:15:00"
            continue_on_timeout: true
          - action: button.press
            target: { entity_id: "{{ back_to }}" }

  # The slow curtain: when the film ends, the house lights come up the way a cinema's do, over a
  # minute and a half, instead of snapping on. The panel calls this when playback stops (see
  # server/sleep.mjs); it only does anything if the room is still set for a movie, so stopping
  # something at lunchtime does not suddenly light the room.
  theater_curtain:
    alias: "Theater: slow curtain"
    icon: mdi:curtains
    mode: restart
    fields:
      seconds:
        description: How long the lights take to come up
        example: 90
    sequence:
      - condition: state
        entity_id: input_select.theater_scene
        state: [Movie time, Intermission]
      - action: light.turn_on
        target: { entity_id: light.media_room_downlights }
        data:
          brightness_pct: 55
          color_temp_kelvin: 2700
          transition: "{{ seconds | default(90) | int }}"
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 30, rgb_color: [255, 150, 70], transition: "{{ seconds | default(90) | int }}" }
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Lights up }

  # The pre-roll: the lights go down over eight seconds while a deep swell builds on the theater
  # speakers, then the panel starts the film (it waits PREROLL_SECONDS and calls play itself).
  # The sound is the panel's own synthesised swell at /assets/preroll.mp3 - not anybody's sound
  # logo - served without a panel key so the speaker can fetch it.
  theater_preroll:
    alias: "Theater: pre-roll"
    mode: restart
    fields:
      speaker:
        description: Media player for the swell
        example: media_player.home_theater_2
      url:
        description: URL of the sound
        example: https://ht-kiosk.coulson.io/assets/preroll.mp3
    sequence:
      - action: light.turn_off
        target: { entity_id: light.media_room_downlights }
        data: { transition: 8 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 3, rgb_color: [255, 110, 35], transition: 8 }
      - action: light.turn_off
        target: { entity_id: light.home_theater_wled }
      # The swell goes through theater_snipe, which also puts a soundbar back on the film's input.
      - action: script.turn_on
        target: { entity_id: script.theater_snipe }
        data:
          variables:
            speaker: "{{ speaker | default('') }}"
            url: "{{ url | default('') }}"

  theater_lights_intermission:
    alias: "Theater: lights for intermission"
    mode: queued
    sequence:
      - action: light.turn_on
        target: { entity_id: light.media_room_downlights }
        data: { brightness_pct: 30, color_temp_kelvin: 2700, transition: 3 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 20, rgb_color: [255, 138, 60], transition: 3 }

  # Lights up without touching the music: the playback automation runs this when the Apple TV
  # goes idle (end of an episode, the screensaver), which must not stop music someone put on.
  # The Lights up button and voice still use theater_lights_up, which stops the music as well.
  theater_lights_bright:
    alias: "Theater: lights up (lights only)"
    mode: queued
    sequence:
      - action: light.turn_on
        target: { entity_id: light.media_room_downlights }
        data: { brightness_pct: 100, color_temp_kelvin: 4000, transition: 4 }
      - action: light.turn_off
        target: { entity_id: [light.home_theater_accent_lights, light.home_theater_wled] }

  theater_aisle_glow:
    alias: "Theater: Aisle glow"
    icon: mdi:lightbulb-night
    mode: single
    sequence:
      # Toggle a very low amber glow so people can find a seat without lighting the screen.
      - if:
          - condition: state
            entity_id: light.home_theater_accent_lights
            state: "on"
          - condition: numeric_state
            entity_id: light.home_theater_accent_lights
            attribute: brightness
            above: 30
        then:
          - action: light.turn_on
            target: { entity_id: light.home_theater_accent_lights }
            data: { brightness_pct: 4, transition: 2 }
        else:
          - action: light.turn_on
            target: { entity_id: light.home_theater_accent_lights }
            data: { brightness_pct: 15, rgb_color: [255, 120, 40], transition: 2 }

  # ---------- playback ----------

  theater_play_plex:
    alias: "Theater: play from Plex"
    icon: mdi:plex
    mode: restart
    fields:
      rating_key: { description: "Plex ratingKey of the movie or episode", example: "358614" }
      media_type: { description: "movie or episode", example: movie }
      offset: { description: "Resume position in seconds", example: 0 }
      apple_tv: { description: "Apple TV media_player", example: media_player.home_theater }
      plex_player: { description: "The Plex client entity for the Apple TV", example: media_player.plex_plex_for_apple_tv_home_theater }
    sequence:
      - if:
          - condition: template
            value_template: "{{ not plex_player }}"
        then:
          - action: persistent_notification.create
            data:
              title: Theater panel
              message: >-
                Playback needs the Plex client entity for the Apple TV. In Plex on the Apple TV turn on
                Settings > Advanced > Allow remote control (Advertise as player), open Plex, press
                "Scan clients" on the Plex integration, then set ENTITY_PLEX_PLAYER in the panel's settings.
          - stop: Plex player not configured
      # Wake the Apple TV; HDMI-CEC turns the projector on and switches to its input.
      - action: media_player.turn_on
        target: { entity_id: "{{ apple_tv }}" }
      # Open Strimr so the client is running and reachable. Launching needs the Apple TV integration
      # paired for the Companion protocol; without it this fails, so carry on and open Strimr by hand.
      - action: media_player.play_media
        target: { entity_id: "{{ apple_tv }}" }
        data: { media_content_type: app, media_content_id: com.github.wunax.strimr }
        continue_on_error: true
      - wait_template: "{{ states(plex_player) not in ['unavailable', 'unknown'] }}"
        timeout: "00:00:25"
        continue_on_timeout: true
      - action: media_player.play_media
        target: { entity_id: "{{ plex_player }}" }
        data:
          media_content_type: "{{ media_type | default('movie') }}"
          media_content_id: >-
            plex://{{ {'plex_key': rating_key | int, 'offset': offset | default(0) | int} | to_json }}
      - action: script.theater_movie_time

  # Play a Plex title on the projector's own Plex client (Plezy): wake the projector if it is off,
  # wait for ADB, then open Plezy's play link (plezy://play?content_id=plezy_<server>_<ratingKey>),
  # which resumes where it left off. The panel builds the link.
  theater_play_projector:
    alias: "Theater: play on the projector"
    icon: mdi:projector
    mode: restart
    fields:
      projector: { description: "Projector ADB media_player" }
      apple_tv: { description: "Apple TV media_player (wakes the projector over HDMI-CEC)" }
      package: { example: com.github.wunax.strimr }
      uri: { example: "plezy://play?content_id=plezy_<machineIdentifier>_358614" }
    sequence:
      - if:
          - condition: template
            value_template: "{{ not projector or not uri }}"
        then:
          - stop: Projector not configured
      - if:
          - condition: template
            value_template: "{{ states(projector) in ['unavailable', 'unknown', 'off'] }}"
        then:
          - action: script.theater_projector_power_on
            data: { projector: "{{ projector }}", apple_tv: "{{ apple_tv }}" }
          - wait_template: "{{ states(projector) not in ['unavailable', 'unknown', 'off'] }}"
            timeout: "00:01:30"
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  title: Theater panel
                  message: >-
                    The projector did not come on within 90 s, so nothing was started. The Apple TV wakes it
                    over HDMI-CEC: check the Apple TV is reachable and ENTITY_PROJECTOR is the projector's ADB entity.
              - stop: Projector did not wake
          - delay: "00:00:03"
      - action: androidtv.adb_command
        target: { entity_id: "{{ projector }}" }
        data:
          command: "am start -a android.intent.action.VIEW -d '{{ uri }}' {{ package }}"
      - action: script.theater_movie_time

  # The official Plex app on the projector: wake it, open Plex over ADB, then hand the title to
  # that Plex client the same way the Apple TV's app is driven.
  theater_play_projector_plex:
    alias: "Theater: play in Plex on the projector"
    icon: mdi:plex
    mode: restart
    fields:
      projector: { description: "Projector ADB media_player" }
      apple_tv: { description: "Apple TV media_player (wakes the projector over HDMI-CEC)" }
      package: { example: com.plexapp.android }
      plex_player: { description: "HA's Plex client for the projector" }
      rating_key: {}
      media_type: { example: movie }
      offset: { example: 0 }
    sequence:
      - if:
          - condition: template
            value_template: "{{ not projector or not plex_player }}"
        then:
          - action: persistent_notification.create
            data:
              title: Theater panel
              message: >-
                Playing in Plex on the projector needs its ADB entity and its Plex client. In Plex on
                the projector turn on Settings > Remote control, then set "Projector's Plex client" on
                the panel's settings page.
          - stop: Not configured
      - if:
          - condition: template
            value_template: "{{ states(projector) in ['unavailable', 'unknown', 'off'] }}"
        then:
          - action: script.theater_projector_power_on
            data: { projector: "{{ projector }}", apple_tv: "{{ apple_tv }}" }
          - wait_template: "{{ states(projector) not in ['unavailable', 'unknown', 'off'] }}"
            timeout: "00:01:30"
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  title: Theater panel
                  message: >-
                    The projector did not come on within 90 s, so Plex was not started. The Apple TV wakes it
                    over HDMI-CEC: check the Apple TV is reachable and ENTITY_PROJECTOR is the projector's ADB entity.
              - stop: Projector did not wake
          - delay: "00:00:03"
      - action: androidtv.adb_command
        target: { entity_id: "{{ projector }}" }
        data:
          command: "monkey -p {{ package }} -c android.intent.category.LEANBACK_LAUNCHER 1"
      - wait_template: "{{ states(plex_player) not in ['unavailable', 'unknown'] }}"
        timeout: "00:00:40"
        continue_on_timeout: true
      - action: media_player.play_media
        target: { entity_id: "{{ plex_player }}" }
        data:
          media_content_type: "{{ media_type | default('movie') }}"
          media_content_id: >-
            plex://{{ {'plex_key': rating_key | int, 'offset': offset | default(0) | int} | to_json }}
      - action: script.theater_movie_time

  # ---------- projector ----------
  # Power: on goes through the Apple TV (HDMI-CEC wakes the projector; it has no network
  # standby, so ADB cannot turn it on). Off, input, apps and picture mode go over ADB
  # (media_player.theater_projector, Android Debug Bridge integration).
  #
  # The picture can also go dark without the projector going off, the way its own power menu's
  # "Screen off" does it: flag the light as deliberately off (cur.appo.light.enabled and
  # cur.prj.screenOff, which keep the eye-protection sensor and the sleep logic from re-lighting
  # it or standing the projector by), then the vendor's test tool sends the light engine its serial
  # "AT+LightSource=Off". The laser and fans stop, Android stays awake, so ADB, CEC and the apps
  # keep working and the light comes back in a second - no 25 s warm-up. Any remote key, Pre-show
  # and Movie time turn it back on.

  theater_projector_power_on:
    alias: "Theater: projector on"
    fields:
      projector: { description: "Projector ADB media_player (optional)" }
      apple_tv: { description: "Apple TV media_player" }
    sequence:
      # The ADB entity can't wake it (no network standby): the Apple TV wakes it over HDMI-CEC.
      # Once the theater's ESP32 CEC node is in, press its "Projector wake" button here instead.
      - action: media_player.turn_on
        target: { entity_id: "{{ apple_tv }}" }

  # "Off" keeps the projector on the network around the clock (ADB, CEC and the plugin all need it):
  # the picture goes dark through the plugin (laser and fans stop, Android stays awake) and the
  # Apple TV is sent to sleep, which puts a CEC standby on the HDMI-1 input. The vendor's own
  # power menu is not used: its Power Off row is a platform standby that drops the network and
  # leaves the projector deaf to ADB until the Apple TV wakes it (2026-10-22). The VM on HDMI 3
  # has no CEC path from here and is left alone.
  theater_projector_power_off:
    alias: "Theater: projector off"
    fields:
      projector: { description: "unused; kept for the callers" }
      apple_tv: { description: "Apple TV media_player" }
    sequence:
      - action: script.theater_projector_light_off
      - action: media_player.turn_off
        target: { entity_id: "{{ apple_tv }}" }
        continue_on_error: true

  # The picture, input and picture mode go through the NexiGo Aurora plugin on the projector's
  # own Kiosk Satellite (github.com/davidcoulson/kiosk-satellite-nexigo-aurora): the plugin runs
  # the same commands from inside the projector and reads the result back, so there is no ADB in
  # the path and the entities carry real state. The `projector` field is kept for the callers.
  theater_projector_light_off:
    alias: "Theater: projector picture off"
    icon: mdi:projector-off
    fields:
      projector: { description: "unused; the plugin's switch is fixed below" }
    sequence:
      - condition: template
        value_template: "{{ states('switch.home_theater_aurora_pro_projector_nexigo_aurora_pro_picture') not in ['unavailable', 'unknown'] }}"
      - action: switch.turn_off
        target: { entity_id: switch.home_theater_aurora_pro_projector_nexigo_aurora_pro_picture }

  theater_projector_light_on:
    alias: "Theater: projector picture on"
    icon: mdi:projector
    fields:
      projector: { description: "unused; the plugin's switch is fixed below" }
    sequence:
      # A projector still booting after a CEC wake has no switch yet; give it the boot time.
      - wait_template: "{{ states('switch.home_theater_aurora_pro_projector_nexigo_aurora_pro_picture') not in ['unavailable', 'unknown'] }}"
        timeout: "00:01:30"
        continue_on_timeout: false
      - action: switch.turn_on
        target: { entity_id: switch.home_theater_aurora_pro_projector_nexigo_aurora_pro_picture }

  # Inputs are Android TV inputs on the Aurora Pro's MediaTek build (verified over ADB):
  # HDMI 1 = HW5 (Apple TV, CEC), HDMI 2 = HW6, HDMI 3 = HW7, HDMI 4 = HW8. The projector's
  # current input can be read back with `getprop cur.prj.currentSourceId` (5-8).
  theater_projector_source:
    alias: "Theater: projector source"
    fields:
      projector: { description: "Projector ADB media_player (Android Debug Bridge integration)" }
      apple_tv: {}
      source: { example: HDMI 2 }
    variables:
      hw: >-
        {{ {'Apple TV': 5, 'HDMI 1': 5, 'HDMI 2': 6, 'HDMI 3': 7, 'HDMI 4': 8}.get(source, 0) }}
    sequence:
      - if:
          - condition: template
            value_template: "{{ not projector or hw | int == 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: Theater panel
              message: "Can't switch the projector to {{ source }}: set ENTITY_PROJECTOR to the projector's ADB entity (and use Apple TV or HDMI 1-4)."
          - stop: Projector not configured
      - action: select.select_option
        target: { entity_id: select.home_theater_aurora_pro_projector_nexigo_aurora_pro_input }
        data:
          option: "HDMI {{ hw | int - 4 }}"

  # Picture mode is the `picture_mode` global setting; writing it makes the projector's TV
  # settings service apply the mode (verified: each mode loads its own backlight, colour
  # temperature and hue). Values from the Aurora Pro: 2 Cinema Home, 8 Cinema Pro, 9 Standard,
  # 3 Brightest, 10 Game, 0 Custom.
  theater_projector_picture:
    alias: "Theater: projector picture mode"
    fields:
      projector: { description: "Projector ADB media_player" }
      apple_tv: {}
      mode: { example: Cinema }
    variables:
      value: >-
        {{ {'Cinema': 2, 'Cinema Home': 2, 'Cinema Pro': 8, 'Standard': 9, 'Brightest': 3, 'Game': 10, 'Custom': 0}.get(mode, -1) }}
    sequence:
      - if:
          - condition: template
            value_template: "{{ value | int < 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: Theater panel
              message: "Can't set the projector to {{ mode }}: set ENTITY_PROJECTOR to the projector's ADB entity (modes: Cinema, Cinema Pro, Standard, Brightest, Game)."
          - stop: Projector not configured
      - action: select.select_option
        target: { entity_id: select.home_theater_aurora_pro_projector_nexigo_aurora_pro_picture_mode }
        data:
          option: "{{ {2: 'Cinema Home', 8: 'Cinema Pro', 9: 'Standard', 3: 'Brightest', 10: 'Game', 0: 'Custom'}[value | int] }}"

  # Open an app on the projector's own Android (Plex, YouTube...). If the projector is off it is
  # woken first, then the app starts once ADB answers (the projector takes ~30 s to boot).
  theater_projector_app:
    alias: "Theater: projector app"
    mode: restart    # a second app while the projector boots replaces the first
    fields:
      projector: { description: "Projector ADB media_player" }
      apple_tv: { description: "Apple TV media_player (wakes the projector over HDMI-CEC)" }
      package: { example: com.plexapp.android }
    sequence:
      - if:
          - condition: template
            value_template: "{{ not projector or not package }}"
        then:
          - stop: Projector not configured
      - if:
          - condition: template
            value_template: "{{ states(projector) in ['unavailable', 'unknown', 'off'] }}"
        then:
          - action: script.theater_projector_power_on
            data: { projector: "{{ projector }}", apple_tv: "{{ apple_tv }}" }
          - wait_template: "{{ states(projector) not in ['unavailable', 'unknown', 'off'] }}"
            timeout: "00:01:30"
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  title: Theater panel
                  message: >-
                    The projector did not come on within 90 s, so the app was not opened. The Apple TV wakes it
                    over HDMI-CEC: check the Apple TV is reachable and ENTITY_PROJECTOR is the projector's ADB entity.
              - stop: Projector did not wake
          - delay: "00:00:03"
      - action: androidtv.adb_command
        target: { entity_id: "{{ projector }}" }
        data:
          command: "monkey -p {{ package }} -c android.intent.category.LEANBACK_LAUNCHER 1"

intent_script:
  TheaterPlay:
    description: "Play something from Plex in the theater"
    action:
      - action: esphome.theater_panel_voice
        data: { intent: play, query: "{{ title }}", name: "", route: "" }
      - wait_for_trigger:
          - trigger: state
            entity_id: sensor.home_theater_theater_panel_voice_answer
            not_to: ["…", "unknown", "unavailable"]
        timeout: "00:00:15"
    # The speech template cannot see the script's variables, so it reads the sensor itself.
    speech:
      text: >-
        {% set a = states('sensor.home_theater_theater_panel_voice_answer') %}
        {{ a if a not in ['…', '', 'unknown', 'unavailable'] else 'The theater panel did not answer' }}

  TheaterScene:
    description: "Run one of the theater's scenes"
    action:
      - action: esphome.theater_panel_voice
        data: { intent: scene, name: "{{ scene }}", query: "", route: "" }
    speech:
      text: "{{ scene | replace('_', ' ') | capitalize }}"

  TheaterSurprise:
    description: "Let the panel pick something and start it"
    action:
      - action: esphome.theater_panel_voice
        data: { intent: mystery, query: "", name: "", route: "" }
      - wait_for_trigger:
          - trigger: state
            entity_id: sensor.home_theater_theater_panel_voice_answer
            not_to: ["…", "unknown", "unavailable"]
        timeout: "00:00:15"
    speech:
      text: >-
        {% set a = states('sensor.home_theater_theater_panel_voice_answer') %}
        {{ a if a not in ['…', '', 'unknown', 'unavailable'] else 'I could not find anything to watch' }}

  TheaterScreen:
    description: "Move the theater panel to one of its screens"
    action:
      - action: esphome.theater_panel_navigate
        data: { route: "#/{{ screen }}" }
    speech:
      text: "Showing {{ screen }}"

automation:
  # The panel's update entity (update.home_theater_theater_panel_panel_image) compares the
  # running build with GHCR. Its Install button cannot pull the image - Unraid does that - so the
  # panel fires this event instead and HA leaves a note with the command.
  - id: theater_panel_update_requested
    alias: "Theater: the panel's Install button"
    mode: single
    triggers:
      - trigger: event
        event_type: esphome.theater_panel_update_requested
    actions:
      - action: persistent_notification.create
        data:
          notification_id: theater_panel_update
          title: Theater panel update
          message: >-
            A newer panel image is on GHCR ({{ trigger.event.data.image | default('ghcr.io/davidcoulson/theater-panel:latest') }}).
            On Unraid: /usr/local/emhttp/plugins/dynamix.docker.manager/scripts/update_container theater-panel

  # The picture follows the Apple TV on the projector itself now: the NexiGo plugin (0.3+) reads
  # the projector's HDMI-CEC history and turns the picture on at the Apple TV's Image View On and
  # off at its Standby (or a power report going to standby). HA's Apple TV entity flapped between
  # off and on while the Apple TV stayed asleep (2026-09-27), and the old automation here followed it.

  # The picture turned on with the Apple TV asleep (the remote, the panel, a restart) on its input
  # would only show the projector's "No signal" page: open Projectivy, the projector's launcher, instead.
  # The Apple TV waking takes the picture back to HDMI 1 (above).
  - id: theater_projector_home_without_source
    alias: "Theater: projector shows Projectivy when the Apple TV sleeps"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.home_theater_aurora_pro_projector_nexigo_aurora_pro_picture
        from: "off"
        to: "on"
    conditions:
      - condition: template
        value_template: "{{ state_attr('media_player.theater_projector', 'app_id') in [none, 'com.mediatek.wwtv.tvcenter'] }}"
      # Only on the Apple TV's input: another source (the Unraid VM on HDMI 3) is showing
      # something of its own (2026-10-01: Projectivy came up over the VM).
      - condition: template
        value_template: "{{ states('sensor.home_theater_nexigo_aurora_pro_nexigo_aurora_pro_showing') is match('HDMI 1( |$)') }}"
    actions:
      # The picture coming on may be the Apple TV waking, which HA's entity reports up to a
      # minute late (2026-10-22): give it ten seconds, and only then insist it is still asleep.
      - wait_template: "{{ states('media_player.home_theater') != 'off' }}"
        timeout: "00:00:10"
      - condition: state
        entity_id: media_player.home_theater
        state: "off"
      - action: androidtv.adb_command
        target: { entity_id: media_player.theater_projector }
        data:
          command: "am start -n com.spocky.projengmenu/.ui.home.MainActivity"

  # The projector stays on the network around the clock (the plugin's stay-on guards), so dropping
  # off it means a standby nobody asked for. Say so when it goes, and when it is back, what HDMI-CEC
  # carried just before (the plugin keeps that across the cold boot).
  - id: theater_projector_dropped_off
    alias: "Theater: projector dropped off the network"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.aurora_pro_projector_connectivity
        to: "unavailable"
        for: "00:03:00"
    actions:
      - action: notify.mobile_app_davids_iphone
        data:
          title: "Projector offline"
          message: >-
            The theater projector dropped off the network at
            {{ as_timestamp(trigger.to_state.last_changed) | timestamp_custom('%-I:%M %p') }}.
            Probably a standby; only HDMI-CEC (the Apple TV) or its remote can wake it.

  # "Last boot" moving to a fresh time means the projector booted: after a standby, or mains.
  # A Kiosk Satellite restart or an HA restart brings the same boot time back, which is not news.
  - id: theater_projector_rebooted
    alias: "Theater: projector rebooted"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.home_theater_nexigo_aurora_pro_last_boot
    conditions:
      - condition: template
        value_template: >-
          {% set b = as_datetime(trigger.to_state.state) %}
          {{ b is not none and (now() - b).total_seconds() < 600
             and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}
    actions:
      # The plugin publishes its record of the CEC before the boot a few seconds after it starts.
      - wait_template: >-
          {{ states('sensor.home_theater_nexigo_aurora_pro_nexigo_aurora_pro_cec_before_last_boot')
             not in ['unknown', 'unavailable', ''] }}
        timeout: "00:02:00"
      - action: notify.mobile_app_davids_iphone
        data:
          title: "Projector back online"
          message: >-
            The theater projector booted at
            {{ as_timestamp(trigger.to_state.state) | timestamp_custom('%-I:%M %p') }}.
            Before it went down: {{ states('sensor.home_theater_nexigo_aurora_pro_nexigo_aurora_pro_cec_before_last_boot') }}
      # Single mode and this hold: a Kiosk Satellite restart soon after a boot brings "Last boot"
      # back a second off, which must not notify again.
      - delay: "00:10:00"

  # A cold boot lights the laser with the boot animation and leaves it on. The projector cannot
  # be told to boot dark, but the plugin's switch coming back is the moment to decide: with no
  # source awake, blank it (the front bar goes to its standby lights). A boot caused by the Apple
  # TV waking finds the Apple TV on and leaves the picture alone.
  - id: theater_projector_dark_after_boot
    alias: "Theater: projector boots dark when nothing is on"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.home_theater_aurora_pro_projector_nexigo_aurora_pro_picture
        from: unavailable
        to: "on"
        for: "00:00:05"
    conditions:
      - condition: state
        entity_id: media_player.home_theater
        state: ["off", "standby", "unavailable"]
      # A plugin install or a Kiosk Satellite restart also drops every entity to unavailable; only
      # a real boot brings the projector's network up within the last few minutes.
      - condition: template
        value_template: >-
          {{ states('sensor.aurora_pro_projector_network_uptime') | as_datetime is not none
             and (now() - states('sensor.aurora_pro_projector_network_uptime') | as_datetime).total_seconds() < 600 }}
    actions:
      - action: script.theater_projector_light_off

  # The plugin's stay-on guard turns off every way the projector stands by on its own (vendor
  # sleep timer, no-signal shutdown, the source's CEC standby) so a paused film is never cut.
  # This is our own timer. It looks every five minutes rather than arming on a state change, so
  # a reload, a failed attempt or a late input switch is retried, and it stands the projector by
  # only when nobody can be watching (it darkens the picture and sleeps the Apple TV; the
  # projector stays on the network):
  #   - eye protection up for 25 minutes with the laser cold (~95 °F; lit it runs 130 °F and up):
  #     on 2026-10-21 the flag stuck at 14:15 and the projector sat awake on a dark wall all night;
  #   - the launcher showing for 20 minutes with no key pressed in that time (Android's power
  #     manager counts every remote key as user activity);
  #   - the Apple TV's input showing for 10 minutes while the Apple TV is paused or idle (home
  #     screen, screensaver) for an hour, or asleep for 10 minutes. Never the VM on HDMI 3.
  - id: theater_projector_idle_standby
    alias: "Theater: projector stands by when nobody can be watching"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      # Already dark: nothing to do (and no repeating every five minutes).
      - condition: state
        entity_id: switch.home_theater_aurora_pro_projector_nexigo_aurora_pro_picture
        state: "on"
      - condition: template
        value_template: >-
          {% set showing = states.sensor.home_theater_nexigo_aurora_pro_nexigo_aurora_pro_showing %}
          {% set atv = states.media_player.home_theater %}
          {% set eye = states.binary_sensor.home_theater_nexigo_aurora_pro_nexigo_aurora_pro_eye_protection %}
          {% if showing is none or showing.state in ['unavailable', 'unknown'] or atv is none %}
            false
          {% else %}
            {% set showing_for = (now() - showing.last_changed).total_seconds() %}
            {% set atv_for = (now() - atv.last_changed).total_seconds() %}
            {% set quiet_for = (now() - (states('sensor.theater_apple_tv_last_active') | as_datetime(atv.last_changed))).total_seconds() %}
            {{ (eye is not none and eye.state == 'on' and (now() - eye.last_changed).total_seconds() > 1500
                and states('sensor.home_theater_nexigo_aurora_pro_nexigo_aurora_pro_laser_temperature') | float(999) < 113)
               or (showing.state == 'Projectivy' and showing_for > 1200)
               or (showing.state is match('HDMI 1( |$)') and showing_for > 600
                   and ((atv.state in ['paused', 'idle'] and quiet_for > 3600)
                        or (atv.state == 'off' and atv_for > 600))) }}
          {% endif %}
    actions:
      - if:
          - condition: state
            entity_id: sensor.home_theater_nexigo_aurora_pro_nexigo_aurora_pro_showing
            state: "Projectivy"
        then:
          # Nothing in HA sees remote presses; ask Android when the last one was. No match
          # (a changed dump, a failed read) parses as 0 ms ago and keeps the projector on.
          - action: androidtv.adb_command
            target: { entity_id: media_player.theater_projector }
            data:
              command: "dumpsys power | grep -o 'mLastUserActivityTime=.*'"
          - condition: template
            value_template: >-
              {{ (state_attr('media_player.theater_projector', 'adb_response') | default('', true)
                  | regex_findall('mLastUserActivityTime=\\d+ \\((\\d+) ms ago\\)') | first | default(0) | int(0)) > 1200000 }}
      - action: script.theater_projector_power_off
        data:
          projector: media_player.theater_projector
          apple_tv: media_player.home_theater
      # The plugin reads the light state back from the projector within seconds.
      - wait_template: "{{ is_state('switch.home_theater_aurora_pro_projector_nexigo_aurora_pro_picture', 'off') }}"
        timeout: "00:01:00"
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: notify.mobile_app_davids_iphone
            data:
              title: "Projector would not go dark"
              message: >-
                The theater projector is still showing
                {{ states('sensor.home_theater_nexigo_aurora_pro_nexigo_aurora_pro_showing') }}
                after the idle watchdog turned the picture off. It will try again in 30 minutes.
          # Single mode: this hold spaces the retries (and the alerts) out to half an hour.
          - delay: "00:30:00"

  # The Apple TV integration sometimes stops answering (pyatv loses its remote-control channel),
  # and then nothing can wake the projector. Reload it when the Apple TV has been unavailable for
  # a few minutes.
  - id: theater_reload_apple_tv
    alias: "Theater: reload the Apple TV integration when it stops answering"
    mode: single
    triggers:
      - trigger: state
        entity_id: media_player.home_theater
        to: unavailable
        for: "00:05:00"
    actions:
      - action: homeassistant.reload_config_entry
        target: { entity_id: media_player.home_theater }

  # The Android Debug Bridge integration can take many minutes to notice the projector has booted.
  # Give it a nudge once the projector is awake: when the Apple TV comes on (its HDMI-CEC wakes the
  # projector), and again while the projector's entity is still unavailable.
  - id: theater_reload_projector_adb
    alias: "Theater: reload the projector's ADB connection once it is awake"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: media_player.home_theater
        from: "off"
        to: [idle, playing, paused, standby]
        id: woke
      - trigger: state
        entity_id: media_player.theater_projector
        to: unavailable
        for: "00:03:00"
        id: stuck
      # HA's Apple TV entity can miss a whole sleep and wake (idle all evening on 2026-10-22), so
      # the projector's own reconnecting is the surer sign that it is awake.
      - trigger: state
        entity_id: binary_sensor.aurora_pro_projector_connectivity
        from: unavailable
        to: "on"
        id: woke
    conditions:
      - condition: state
        entity_id: media_player.theater_projector
        state: unavailable
    actions:
      - if:
          - condition: trigger
            id: woke
        then:
          - delay: "00:00:45"      # let the projector finish booting
      - action: homeassistant.reload_config_entry
        target: { entity_id: media_player.theater_projector }
      - delay: "00:01:00"          # don't spin if it is genuinely off

  # Lights follow playback on the Apple TV or on the projector's own Plex client (Plezy, seen by
  # HA's Plex integration as "Plezy - AURORA PRO"): dark while playing, 30% when paused for a
  # while, back up when playback ends. The 10 s pause delay stops a quick pause from lighting
  # the room. A Plex client that disappears (unavailable) counts as stopped; the Apple TV does
  # not, because pyatv drops it to unavailable mid-movie (see theater_reload_apple_tv above).
  - id: theater_lights_follow_playback
    alias: "Theater: lights follow playback"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [media_player.home_theater, media_player.plex_plezy_aurora_pro]
        to: playing
        for: "00:00:02"
        id: playing
      - trigger: state
        entity_id: [media_player.home_theater, media_player.plex_plezy_aurora_pro]
        to: paused
        for: "00:00:10"
        id: paused
      - trigger: state
        entity_id: media_player.home_theater
        from: [playing, paused]
        to: [idle, standby, "off"]
        for: "00:00:20"
        id: stopped
      - trigger: state
        entity_id: media_player.plex_plezy_aurora_pro
        from: [playing, paused]
        to: [idle, standby, "off", unavailable]
        for: "00:00:20"
        id: stopped
    conditions:
      - condition: state
        entity_id: input_boolean.theater_auto_lights
        state: "on"
    actions:
      - choose:
          - conditions: { condition: trigger, id: playing }
            sequence:
              - action: script.theater_lights_movie
              - action: input_select.select_option
                target: { entity_id: input_select.theater_scene }
                data: { option: Movie time }
          - conditions: { condition: trigger, id: paused }
            sequence:
              # Lights only: the Intermission scene is what puts the snack-bar screen on the panel,
              # and a plain pause should not do that. The Intermission button still does.
              - action: script.theater_lights_intermission
          - conditions: { condition: trigger, id: stopped }
            sequence:
              # Lights only: the music player is left alone (see theater_lights_bright).
              - action: script.theater_lights_bright
              - action: input_select.select_option
                target: { entity_id: input_select.theater_scene }
                data: { option: Lights up }

  # ---------- the gaming PC (the Windows 11 VM on Unraid) ----------
  # Its sensors come from the Unraid Management Agent, read inside the VM through the QEMU guest
  # agent (they stay available, with unknown values, while the VM is off), and from the theater
  # panel (Gaming PC: the VM's state, Game: what Steam says is running).

  - id: theater_pc_gpu_hot
    alias: "Theater: gaming PC GPU running hot"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.unfinished_basement_unraid_vms_windows_11_gpu_0_temperature
        above: 170   # °F (77 °C): well above anything seen in play (the card is watercooled)
        for: "00:02:00"
    actions:
      - action: notify.mobile_app_davids_iphone
        data:
          title: "Gaming PC running hot"
          message: >-
            The 4090 has been over 170 °F for two minutes
            ({{ states('sensor.unfinished_basement_unraid_vms_windows_11_gpu_0_temperature') | float | round }} °F
            at {{ states('sensor.unfinished_basement_unraid_vms_windows_11_gpu_0_utilization') }}% load). Check the loop.
      - delay: "00:30:00"

  - id: theater_pc_vram_full
    alias: "Theater: gaming PC VRAM nearly full"
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {# used is in GiB; the total is an attribute, in bytes #}
          {% set u = states('sensor.unfinished_basement_unraid_vms_windows_11_gpu_0_memory_used') | float(0) * 1073741824 %}
          {% set t = state_attr('sensor.unfinished_basement_unraid_vms_windows_11_gpu_0_memory_used', 'memory_total_bytes') | float(0) %}
          {{ t > 0 and u / t > 0.92 }}
        for: "00:02:00"
    actions:
      - action: notify.mobile_app_davids_iphone
        data:
          title: "Gaming PC VRAM nearly full"
          message: >-
            {{ states('sensor.unfinished_basement_unraid_vms_windows_11_gpu_0_memory_used') | float | round(1) }} GB of
            {{ (state_attr('sensor.unfinished_basement_unraid_vms_windows_11_gpu_0_memory_used', 'memory_total_bytes') | float / 1073741824) | round }} GB in use
            {% if states('sensor.home_theater_theater_panel_game') not in ['', 'unknown', 'unavailable'] %}by {{ states('sensor.home_theater_theater_panel_game') }}{% endif %}.
            Texture settings may be a notch too high.
      - delay: "00:30:00"

  - id: theater_pc_low_fps
    alias: "Theater: gaming PC frame rate has dropped"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.unfinished_basement_unraid_vms_windows_11_fps
        below: 60
        above: 0
        for: "00:02:00"
    conditions:
      - condition: template
        value_template: "{{ states('sensor.home_theater_theater_panel_game') not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - action: notify.mobile_app_davids_iphone
        data:
          title: "Frame rate has dropped"
          message: >-
            {{ states('sensor.home_theater_theater_panel_game') }} has been under 60 fps for two minutes
            ({{ states('sensor.unfinished_basement_unraid_vms_windows_11_fps') | float | round }} fps, GPU {{ states('sensor.unfinished_basement_unraid_vms_windows_11_gpu_0_utilization') }}%,
            CPU {{ states('sensor.windows_11_cpu_usage') }}%).
      - delay: "00:30:00"

  # The VM says it is running (Unraid's word, through the panel) but its guest agent has not
  # answered for three minutes: Windows has hung.
  - id: theater_pc_dropped_off
    alias: "Theater: gaming PC dropped off the network"
    mode: single
    triggers:
      - trigger: template
        value_template: "{{ state_attr('sensor.unfinished_basement_unraid_vms_windows_11_guest_hostname', 'agent_connected') == false }}"
        for: "00:03:00"
    conditions:
      - condition: state
        entity_id: sensor.home_theater_theater_panel_gaming_pc
        state: "running"
    actions:
      - action: notify.mobile_app_davids_iphone
        data:
          title: "Gaming PC not answering"
          message: >-
            Unraid says the Windows VM is running, but its guest agent has not answered for
            three minutes. It may have hung; the panel's power menu can restart it.

# When the Apple TV last went to or from anything but paused and idle, so the watchdog's hour
# runs across a pause that turns into the screensaver (the entity's last_changed restarts it).
template:
  - triggers:
      - trigger: state
        entity_id: media_player.home_theater
        not_from: ["paused", "idle"]
      - trigger: state
        entity_id: media_player.home_theater
        not_to: ["paused", "idle"]
    sensor:
      - name: "Theater Apple TV last active"
        unique_id: theater_apple_tv_last_active
        device_class: timestamp
        state: "{{ now().isoformat() }}"

# The VM's frame-time graph sensor is a long string that changes every few seconds and is only
# drawn live by the panel, so keep it out of the recorder and InfluxDB. Packages merge these
# lists into the exclude blocks in configuration.yaml.
recorder:
  exclude:
    entity_globs:
      - sensor.*_windows_11_frames
      - sensor.*_windows_11_frames_graph

influxdb:
  exclude:
    entity_globs:
      - sensor.*_windows_11_frames
      - sensor.*_windows_11_frames_graph
