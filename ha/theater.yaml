# Theater panel: Home Assistant package.
#
# Install: copy to /config/packages/theater.yaml and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant (or reload scripts, automations and input helpers).
#
# The panel calls only these scripts, so the same scenes work from Pico remotes, voice and
# the HA app. Room entities are named here; if you rename a light, change it in this file and
# in the panel's ENTITY_LIGHTS setting.
#
#   Downlights    light.media_room_downlights        (4 Govee, dimmable, color temp + RGB)
#   Accent lights light.home_theater_accent_lights   (4 Govee accents, RGB)
#   LED strip     light.home_theater_wled            (WLED, 188 LEDs)
#   Apple TV      media_player.home_theater
#   Music         media_player.home_theater_2        (Music Assistant)

# Move the panel to one of its screens from an automation or script, e.g.
#   action: rest_command.theater_panel_navigate
#   data: { route: "#/watch?brand=netflix" }
# Kiosk Satellite's own navigate service moves the HA dashboard around the panel, not the panel.
# If PANEL_KEY is set, add ?key=<PANEL_KEY> to the URL (keep it in secrets.yaml).
# Which build the panel is running, and whether a newer image is waiting on GHCR. Home Assistant
# turns this into an update entity below. Add ?key=<PANEL_KEY> to the URL if the panel has a key.
rest:
  - resource: "https://ht-kiosk.coulson.io/api/version"
    scan_interval: 1800
    sensor:
      - name: "Theater panel build"
        unique_id: theater_panel_build
        value_template: "{{ value_json.installed }}"
        json_attributes: [installed, latest, update, built, image]
    binary_sensor:
      - name: "Theater panel update available"
        unique_id: theater_panel_update_available
        device_class: update
        value_template: "{{ value_json.update }}"

rest_command:
  # Voice goes through the panel: it finds the title in Plex and starts it the same way the
  # panel's own Play button does. See the sentences in custom_sentences/en/theater.yaml.
  theater_panel_voice:
    url: "https://ht-kiosk.coulson.io/api/voice"
    method: post
    content_type: "application/json"
    payload: '{{ {"intent": intent, "query": query | default(""), "name": name | default(""), "route": route | default("")} | to_json }}'

  theater_panel_navigate:
    url: https://ht-kiosk.coulson.io/api/navigate
    method: POST
    content_type: application/json
    payload: '{"route": "{{ route }}"}'

input_select:
  theater_scene:
    name: Theater scene
    icon: mdi:theater
    options: ["Off", "Pre-show", "Movie time", "Intermission", "Lights up"]

input_boolean:
  theater_auto_lights:
    name: Theater lights follow playback
    icon: mdi:lightbulb-auto
    initial: true

script:
  # ---------- scenes ----------

  theater_pre_show:
    alias: "Theater: Pre-show"
    icon: mdi:music
    sequence:
      - action: light.turn_on
        target: { entity_id: light.media_room_downlights }
        data: { brightness_pct: 40, color_temp_kelvin: 2700, transition: 3 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 25, rgb_color: [255, 138, 60], transition: 3 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_wled }
        data: { brightness_pct: 60, effect: Candle }
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Pre-show }

  theater_movie_time:
    alias: "Theater: Movie time"
    icon: mdi:filmstrip
    sequence:
      # Stop pre-show music; the movie has the room now.
      - action: media_player.media_pause
        target: { entity_id: media_player.home_theater_2 }
        continue_on_error: true
      - action: script.theater_lights_movie
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Movie time }

  theater_intermission:
    alias: "Theater: Intermission"
    icon: mdi:coffee
    sequence:
      - action: media_player.media_pause
        target: { entity_id: media_player.home_theater }
        continue_on_error: true
      - action: script.theater_lights_intermission
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Intermission }

  theater_lights_up:
    alias: "Theater: Lights up"
    icon: mdi:weather-sunny
    sequence:
      - action: media_player.media_stop
        target: { entity_id: media_player.home_theater_2 }
        continue_on_error: true
      - action: light.turn_on
        target: { entity_id: light.media_room_downlights }
        data: { brightness_pct: 100, color_temp_kelvin: 4000, transition: 4 }
      - action: light.turn_off
        target: { entity_id: [light.home_theater_accent_lights, light.home_theater_wled] }
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Lights up }

  theater_all_off:
    alias: "Theater: All off"
    icon: mdi:power
    sequence:
      - action: light.turn_off
        target: { entity_id: [light.media_room_downlights, light.home_theater_accent_lights, light.home_theater_wled] }
        data: { transition: 3 }
      - action: media_player.media_stop
        target: { entity_id: media_player.home_theater_2 }
        continue_on_error: true
      # Turning the Apple TV off sends HDMI-CEC standby to the projector.
      - action: media_player.turn_off
        target: { entity_id: media_player.home_theater }
        continue_on_error: true
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: "Off" }

  # Lights only, used by the scenes above and by the playback automation (which must not
  # pause the movie itself).
  theater_lights_movie:
    alias: "Theater: lights for the movie"
    sequence:
      - action: light.turn_off
        target: { entity_id: light.media_room_downlights }
        data: { transition: 6 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 4, rgb_color: [255, 120, 40], transition: 6 }
      - action: light.turn_off
        target: { entity_id: light.home_theater_wled }

  # Any sound the panel wants played in the room: the intermission march, and whatever comes
  # next. The panel passes the speaker and a URL it serves itself.
  theater_snipe:
    alias: "Theater: play a sound in the room"
    mode: restart
    fields:
      speaker:
        description: Media player to play it on
        example: media_player.home_theater_2
      url:
        description: URL of the sound
        example: https://ht-kiosk.coulson.io/assets/intermission.mp3
    sequence:
      - condition: template
        value_template: "{{ speaker is defined and speaker and url is defined and url }}"
      - action: media_player.play_media
        target: { entity_id: "{{ speaker }}" }
        data:
          media_content_id: "{{ url }}"
          media_content_type: music

  # The slow curtain: when the film ends, the house lights come up the way a cinema's do, over a
  # minute and a half, instead of snapping on. The panel calls this when playback stops (see
  # server/sleep.mjs); it only does anything if the room is still set for a movie, so stopping
  # something at lunchtime does not suddenly light the room.
  theater_curtain:
    alias: "Theater: slow curtain"
    icon: mdi:curtains
    mode: restart
    fields:
      seconds:
        description: How long the lights take to come up
        example: 90
    sequence:
      - condition: state
        entity_id: input_select.theater_scene
        state: [Movie time, Intermission]
      - action: light.turn_on
        target: { entity_id: light.media_room_downlights }
        data:
          brightness_pct: 55
          color_temp_kelvin: 2700
          transition: "{{ seconds | default(90) | int }}"
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 30, rgb_color: [255, 150, 70], transition: "{{ seconds | default(90) | int }}" }
      - action: input_select.select_option
        target: { entity_id: input_select.theater_scene }
        data: { option: Lights up }

  # The pre-roll: the lights go down over eight seconds while a deep swell builds on the theater
  # speakers, then the panel starts the film (it waits PREROLL_SECONDS and calls play itself).
  # The sound is the panel's own synthesised swell at /assets/preroll.mp3 - not anybody's sound
  # logo - served without a panel key so the speaker can fetch it.
  theater_preroll:
    alias: "Theater: pre-roll"
    mode: restart
    fields:
      speaker:
        description: Media player for the swell
        example: media_player.home_theater_2
      url:
        description: URL of the sound
        example: https://ht-kiosk.coulson.io/assets/preroll.mp3
    sequence:
      - action: light.turn_off
        target: { entity_id: light.media_room_downlights }
        data: { transition: 8 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 3, rgb_color: [255, 110, 35], transition: 8 }
      - action: light.turn_off
        target: { entity_id: light.home_theater_wled }
      - condition: template
        value_template: "{{ speaker is defined and speaker and url is defined and url }}"
      - action: media_player.play_media
        target: { entity_id: "{{ speaker }}" }
        data:
          media_content_id: "{{ url }}"
          media_content_type: music

  theater_lights_intermission:
    alias: "Theater: lights for intermission"
    sequence:
      - action: light.turn_on
        target: { entity_id: light.media_room_downlights }
        data: { brightness_pct: 30, color_temp_kelvin: 2700, transition: 3 }
      - action: light.turn_on
        target: { entity_id: light.home_theater_accent_lights }
        data: { brightness_pct: 20, rgb_color: [255, 138, 60], transition: 3 }

  theater_aisle_glow:
    alias: "Theater: Aisle glow"
    icon: mdi:lightbulb-night
    mode: single
    sequence:
      # Toggle a very low amber glow so people can find a seat without lighting the screen.
      - if:
          - condition: state
            entity_id: light.home_theater_accent_lights
            state: "on"
          - condition: numeric_state
            entity_id: light.home_theater_accent_lights
            attribute: brightness
            above: 30
        then:
          - action: light.turn_on
            target: { entity_id: light.home_theater_accent_lights }
            data: { brightness_pct: 4, transition: 2 }
        else:
          - action: light.turn_on
            target: { entity_id: light.home_theater_accent_lights }
            data: { brightness_pct: 15, rgb_color: [255, 120, 40], transition: 2 }

  # ---------- playback ----------

  theater_play_plex:
    alias: "Theater: play from Plex"
    icon: mdi:plex
    mode: restart
    fields:
      rating_key: { description: "Plex ratingKey of the movie or episode", example: "358614" }
      media_type: { description: "movie or episode", example: movie }
      offset: { description: "Resume position in seconds", example: 0 }
      apple_tv: { description: "Apple TV media_player", example: media_player.home_theater }
      plex_player: { description: "The Plex client entity for the Apple TV", example: media_player.plex_plex_for_apple_tv_home_theater }
    sequence:
      - if:
          - condition: template
            value_template: "{{ not plex_player }}"
        then:
          - action: persistent_notification.create
            data:
              title: Theater panel
              message: >-
                Playback needs the Plex client entity for the Apple TV. In Plex on the Apple TV turn on
                Settings > Advanced > Allow remote control (Advertise as player), open Plex, press
                "Scan clients" on the Plex integration, then set ENTITY_PLEX_PLAYER in the panel's settings.
          - stop: Plex player not configured
      # Wake the Apple TV; HDMI-CEC turns the projector on and switches to its input.
      - action: media_player.turn_on
        target: { entity_id: "{{ apple_tv }}" }
      # Open Plex so the client is running and reachable.
      - action: media_player.select_source
        target: { entity_id: "{{ apple_tv }}" }
        data: { source: Plex }
      - wait_template: "{{ states(plex_player) not in ['unavailable', 'unknown'] }}"
        timeout: "00:00:25"
        continue_on_timeout: true
      - action: media_player.play_media
        target: { entity_id: "{{ plex_player }}" }
        data:
          media_content_type: "{{ media_type | default('movie') }}"
          media_content_id: >-
            plex://{{ {'plex_key': rating_key | int, 'offset': offset | default(0) | int} | to_json }}
      - action: script.theater_movie_time

  # Play a Plex title on the projector's own Plex client (Plezy): wake the projector if it is off,
  # wait for ADB, then open Plezy's play link (plezy://play?content_id=plezy_<server>_<ratingKey>),
  # which resumes where it left off. The panel builds the link.
  theater_play_projector:
    alias: "Theater: play on the projector"
    icon: mdi:projector
    mode: restart
    fields:
      projector: { description: "Projector ADB media_player" }
      apple_tv: { description: "Apple TV media_player (wakes the projector over HDMI-CEC)" }
      package: { example: com.edde746.plezy }
      uri: { example: "plezy://play?content_id=plezy_<machineIdentifier>_358614" }
    sequence:
      - if:
          - condition: template
            value_template: "{{ not projector or not uri }}"
        then:
          - stop: Projector not configured
      - if:
          - condition: template
            value_template: "{{ states(projector) in ['unavailable', 'unknown', 'off'] }}"
        then:
          - action: script.theater_projector_power_on
            data: { projector: "{{ projector }}", apple_tv: "{{ apple_tv }}" }
          - wait_template: "{{ states(projector) not in ['unavailable', 'unknown', 'off'] }}"
            timeout: "00:01:30"
            continue_on_timeout: false
          - delay: "00:00:03"
      - action: androidtv.adb_command
        target: { entity_id: "{{ projector }}" }
        data:
          command: "am start -a android.intent.action.VIEW -d '{{ uri }}' {{ package }}"
      - action: script.theater_movie_time

  # The official Plex app on the projector: wake it, open Plex over ADB, then hand the title to
  # that Plex client the same way the Apple TV's app is driven.
  theater_play_projector_plex:
    alias: "Theater: play in Plex on the projector"
    icon: mdi:plex
    mode: restart
    fields:
      projector: { description: "Projector ADB media_player" }
      apple_tv: { description: "Apple TV media_player (wakes the projector over HDMI-CEC)" }
      package: { example: com.plexapp.android }
      plex_player: { description: "HA's Plex client for the projector" }
      rating_key: {}
      media_type: { example: movie }
      offset: { example: 0 }
    sequence:
      - if:
          - condition: template
            value_template: "{{ not projector or not plex_player }}"
        then:
          - action: persistent_notification.create
            data:
              title: Theater panel
              message: >-
                Playing in Plex on the projector needs its ADB entity and its Plex client. In Plex on
                the projector turn on Settings > Remote control, then set "Projector's Plex client" on
                the panel's settings page.
          - stop: Not configured
      - if:
          - condition: template
            value_template: "{{ states(projector) in ['unavailable', 'unknown', 'off'] }}"
        then:
          - action: script.theater_projector_power_on
            data: { projector: "{{ projector }}", apple_tv: "{{ apple_tv }}" }
          - wait_template: "{{ states(projector) not in ['unavailable', 'unknown', 'off'] }}"
            timeout: "00:01:30"
            continue_on_timeout: false
          - delay: "00:00:03"
      - action: androidtv.adb_command
        target: { entity_id: "{{ projector }}" }
        data:
          command: "monkey -p {{ package }} -c android.intent.category.LEANBACK_LAUNCHER 1"
      - wait_template: "{{ states(plex_player) not in ['unavailable', 'unknown'] }}"
        timeout: "00:00:40"
        continue_on_timeout: true
      - action: media_player.play_media
        target: { entity_id: "{{ plex_player }}" }
        data:
          media_content_type: "{{ media_type | default('movie') }}"
          media_content_id: >-
            plex://{{ {'plex_key': rating_key | int, 'offset': offset | default(0) | int} | to_json }}
      - action: script.theater_movie_time

  # ---------- projector ----------
  # Power: on goes through the Apple TV (HDMI-CEC wakes the projector; it has no network
  # standby, so ADB cannot turn it on). Off, input, apps and picture mode go over ADB
  # (media_player.theater_projector, Android Debug Bridge integration).

  theater_projector_power_on:
    alias: "Theater: projector on"
    fields:
      projector: { description: "Projector ADB media_player (optional)" }
      apple_tv: { description: "Apple TV media_player" }
    sequence:
      # The ADB entity can't wake it (no network standby): the Apple TV wakes it over HDMI-CEC.
      # Once the theater's ESP32 CEC node is in, press its "Projector wake" button here instead.
      - action: media_player.turn_on
        target: { entity_id: "{{ apple_tv }}" }

  theater_projector_power_off:
    alias: "Theater: projector off"
    fields:
      projector: { description: "Projector ADB media_player (optional)" }
      apple_tv: { description: "Apple TV media_player" }
    sequence:
      - action: media_player.turn_off
        target: { entity_id: "{{ projector if projector else apple_tv }}" }

  # Inputs are Android TV inputs on the Aurora Pro's MediaTek build (verified over ADB):
  # HDMI 1 = HW5 (Apple TV, CEC), HDMI 2 = HW6, HDMI 3 = HW7, HDMI 4 = HW8. The projector's
  # current input can be read back with `getprop cur.prj.currentSourceId` (5-8).
  theater_projector_source:
    alias: "Theater: projector source"
    fields:
      projector: { description: "Projector ADB media_player (Android Debug Bridge integration)" }
      apple_tv: {}
      source: { example: HDMI 2 }
    variables:
      hw: >-
        {{ {'Apple TV': 5, 'HDMI 1': 5, 'HDMI 2': 6, 'HDMI 3': 7, 'HDMI 4': 8}.get(source, 0) }}
    sequence:
      - if:
          - condition: template
            value_template: "{{ not projector or hw | int == 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: Theater panel
              message: "Can't switch the projector to {{ source }}: set ENTITY_PROJECTOR to the projector's ADB entity (and use Apple TV or HDMI 1-4)."
          - stop: Projector not configured
      - action: androidtv.adb_command
        target: { entity_id: "{{ projector }}" }
        data:
          command: >-
            am start -a android.intent.action.VIEW -d
            content://android.media.tv/passthrough/com.mediatek.tvinput%2F.hdmi.HDMIInputService%2FHW{{ hw }}

  # Picture mode is the `picture_mode` global setting; writing it makes the projector's TV
  # settings service apply the mode (verified: each mode loads its own backlight, colour
  # temperature and hue). Values from the Aurora Pro: 2 Cinema Home, 8 Cinema Pro, 9 Standard,
  # 3 Brightest, 10 Game, 0 Custom.
  theater_projector_picture:
    alias: "Theater: projector picture mode"
    fields:
      projector: { description: "Projector ADB media_player" }
      apple_tv: {}
      mode: { example: Cinema }
    variables:
      value: >-
        {{ {'Cinema': 2, 'Cinema Home': 2, 'Cinema Pro': 8, 'Standard': 9, 'Brightest': 3, 'Game': 10, 'Custom': 0}.get(mode, -1) }}
    sequence:
      - if:
          - condition: template
            value_template: "{{ not projector or value | int < 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: Theater panel
              message: "Can't set the projector to {{ mode }}: set ENTITY_PROJECTOR to the projector's ADB entity (modes: Cinema, Cinema Pro, Standard, Brightest, Game)."
          - stop: Projector not configured
      - action: androidtv.adb_command
        target: { entity_id: "{{ projector }}" }
        data:
          command: "settings put global picture_mode {{ value | int }}"

  # Open an app on the projector's own Android (Plex, YouTube...). If the projector is off it is
  # woken first, then the app starts once ADB answers (the projector takes ~30 s to boot).
  theater_projector_app:
    alias: "Theater: projector app"
    fields:
      projector: { description: "Projector ADB media_player" }
      apple_tv: { description: "Apple TV media_player (wakes the projector over HDMI-CEC)" }
      package: { example: com.plexapp.android }
    sequence:
      - if:
          - condition: template
            value_template: "{{ not projector or not package }}"
        then:
          - stop: Projector not configured
      - if:
          - condition: template
            value_template: "{{ states(projector) in ['unavailable', 'unknown', 'off'] }}"
        then:
          - action: script.theater_projector_power_on
            data: { projector: "{{ projector }}", apple_tv: "{{ apple_tv }}" }
          - wait_template: "{{ states(projector) not in ['unavailable', 'unknown', 'off'] }}"
            timeout: "00:01:30"
            continue_on_timeout: false
          - delay: "00:00:03"
      - action: androidtv.adb_command
        target: { entity_id: "{{ projector }}" }
        data:
          command: "monkey -p {{ package }} -c android.intent.category.LEANBACK_LAUNCHER 1"

intent_script:
  TheaterPlay:
    description: "Play something from Plex in the theater"
    action:
      - action: rest_command.theater_panel_voice
        data: { intent: play, query: "{{ title }}" }
        response_variable: panel
    speech:
      text: >-
        {% set spoken = (panel.content.spoken if panel is defined and panel.content is defined else none) %}
        {{ "Starting " ~ spoken if spoken else "I could not find " ~ title ~ " in Plex" }}

  TheaterScene:
    description: "Run one of the theater's scenes"
    action:
      - action: rest_command.theater_panel_voice
        data: { intent: scene, name: "{{ scene }}" }
    speech:
      text: "{{ scene | replace('_', ' ') | capitalize }}"

  TheaterSurprise:
    description: "Let the panel pick something and start it"
    action:
      - action: rest_command.theater_panel_voice
        data: { intent: mystery }
        response_variable: panel
    speech:
      text: >-
        {% set spoken = (panel.content.spoken if panel is defined and panel.content is defined else none) %}
        {{ "Tonight you are watching " ~ spoken if spoken else "I could not find anything to watch" }}

  TheaterScreen:
    description: "Move the theater panel to one of its screens"
    action:
      - action: rest_command.theater_panel_voice
        data: { intent: navigate, route: "#/{{ screen }}" }
    speech:
      text: "Showing {{ screen }}"

automation:
  # Publish the panel's version to MQTT so Home Assistant shows a proper update entity
  # (update.theater_panel) next to everything else it tracks. It reports only; installing is a
  # Docker pull on Unraid:
  #   /usr/local/emhttp/plugins/dynamix.docker.manager/scripts/update_container theater-panel
  - id: theater_panel_update_entity
    alias: "Theater: publish the panel's version to MQTT"
    mode: queued
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.theater_panel_build
    actions:
      - action: mqtt.publish
        data:
          topic: homeassistant/update/theater_panel/config
          retain: true
          payload: >-
            {{ {"name": none, "unique_id": "theater_panel_image",
                "state_topic": "theater/panel/version",
                "device": {"identifiers": ["theater_panel"], "name": "Theater panel",
                           "manufacturer": "davidcoulson", "model": "theater-panel"},
                "entity_picture": "https://raw.githubusercontent.com/davidcoulson/theater-panel/main/web/assets/icon.png",
                "release_url": "https://github.com/davidcoulson/theater-panel/commits/main"} | to_json }}
      - action: mqtt.publish
        data:
          topic: theater/panel/version
          retain: true
          payload: >-
            {{ {"installed_version": state_attr('sensor.theater_panel_build', 'installed'),
                "latest_version": state_attr('sensor.theater_panel_build', 'latest'),
                "title": "Theater panel"} | to_json }}

  # The Apple TV integration sometimes stops answering (pyatv loses its remote-control channel),
  # and then nothing can wake the projector. Reload it when the Apple TV has been unavailable for
  # a few minutes.
  - id: theater_reload_apple_tv
    alias: "Theater: reload the Apple TV integration when it stops answering"
    mode: single
    triggers:
      - trigger: state
        entity_id: media_player.home_theater
        to: unavailable
        for: "00:05:00"
    actions:
      - action: homeassistant.reload_config_entry
        target: { entity_id: media_player.home_theater }

  # The Android Debug Bridge integration can take many minutes to notice the projector has booted.
  # Give it a nudge once the projector is awake: when the Apple TV comes on (its HDMI-CEC wakes the
  # projector), and again while the projector's entity is still unavailable.
  - id: theater_reload_projector_adb
    alias: "Theater: reload the projector's ADB connection once it is awake"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: media_player.home_theater
        from: "off"
        to: [idle, playing, paused, standby]
        id: woke
      - trigger: state
        entity_id: media_player.theater_projector
        to: unavailable
        for: "00:03:00"
        id: stuck
    conditions:
      - condition: state
        entity_id: media_player.theater_projector
        state: unavailable
    actions:
      - if:
          - condition: trigger
            id: woke
        then:
          - delay: "00:00:45"      # let the projector finish booting
      - action: homeassistant.reload_config_entry
        target: { entity_id: media_player.theater_projector }
      - delay: "00:01:00"          # don't spin if it is genuinely off

  # Lights follow playback on the Apple TV or on the projector's own Plex client (Plezy, seen by
  # HA's Plex integration as "Plezy - AURORA PRO"): dark while playing, 30% when paused for a
  # while, back up when playback ends. The 10 s pause delay stops a quick pause from lighting
  # the room; a Plex client that disappears (unavailable) counts as stopped.
  - id: theater_lights_follow_playback
    alias: "Theater: lights follow playback"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [media_player.home_theater, media_player.plex_plezy_aurora_pro]
        to: playing
        for: "00:00:02"
        id: playing
      - trigger: state
        entity_id: [media_player.home_theater, media_player.plex_plezy_aurora_pro]
        to: paused
        for: "00:00:10"
        id: paused
      - trigger: state
        entity_id: [media_player.home_theater, media_player.plex_plezy_aurora_pro]
        from: [playing, paused]
        to: [idle, standby, "off", unavailable]
        for: "00:00:20"
        id: stopped
    conditions:
      - condition: state
        entity_id: input_boolean.theater_auto_lights
        state: "on"
    actions:
      - choose:
          - conditions: { condition: trigger, id: playing }
            sequence:
              - action: script.theater_lights_movie
              - action: input_select.select_option
                target: { entity_id: input_select.theater_scene }
                data: { option: Movie time }
          - conditions: { condition: trigger, id: paused }
            sequence:
              - action: script.theater_lights_intermission
              - action: input_select.select_option
                target: { entity_id: input_select.theater_scene }
                data: { option: Intermission }
          - conditions: { condition: trigger, id: stopped }
            sequence:
              - action: script.theater_lights_up
