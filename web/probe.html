<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebView Throttle Probe</title>
<!-- Measures whether the browser is throttling or hiding this page: how late timers and frames
     run, what visibility the page really has (read past any visibility mask), and every
     lifecycle event, as a timeline. Load it as the kiosk's start page and inside an iframe on a
     Home Assistant dashboard, side by side, to tell the kiosk app's doing from the WebView's.
     ?log=1 also sends notable events to this server's log (docker logs theater-panel). -->
<style>
  :root { color-scheme: dark; --bg: #0F1114; --panel: #181B20; --line: #2A2F37; --text: #E8EAED; --dim: #8E96A3;
    --ok: #4CC38A; --warn: #F2B544; --bad: #F2555A; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
  .meta { color: var(--dim); font: 13px/1.5 ui-monospace, monospace; margin-bottom: 16px; word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile span { display: block; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .tile b { display: block; font: 600 26px/1.2 ui-monospace, monospace; margin-top: 4px; }
  .tile small { color: var(--dim); font: 12px ui-monospace, monospace; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); margin: 0 0 8px; }
  #log { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0;
    font: 13px/1.6 ui-monospace, monospace; max-height: 46vh; overflow: auto; white-space: pre-wrap; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; margin-left: 8px; }
</style>
</head>
<body>
  <h1>WebView throttle probe</h1>
  <div class="meta" id="meta"></div>
  <div class="grid">
    <div class="tile"><span>Visibility (real)</span><b id="vis">-</b><small id="visRep"></small></div>
    <div class="tile"><span>Timer lag</span><b id="timer">-</b><small id="timerMax"></small></div>
    <div class="tile"><span>Frame gap</span><b id="frame">-</b><small id="frameMax"></small></div>
    <div class="tile"><span>1 s interval drift</span><b id="drift">-</b><small id="driftMax"></small></div>
    <div class="tile"><span>On screen</span><b id="inview">-</b><small id="focus"></small></div>
    <div class="tile"><span>Fetch round trip</span><b id="fetch">-</b><small id="fetchMax"></small></div>
  </div>
  <h2>Timeline <button id="clear" type="button">Clear</button></h2>
  <pre id="log"></pre>
  <script src="probe.js"></script>
</body>
</html>
